[workspace]
authors = ["sylens wong <qiumin14@163.com>"]
channels = ["conda-forge"]
name = "LabFlow"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
start = "python server.py"
serve = "bash deploy/run.sh"
dev = "python server.py"
test = "python -m pytest tests/ -v"
migrate-seekdb = "python -m server.migrate_sqlite_to_seekdb"
pk-spike = "python spikes/pk_autoincrement_spike.py"
service-install = "bash deploy/install-service.sh"
service-uninstall = "bash deploy/uninstall-service.sh"
backup = "bash deploy/backup.sh"
restore = "bash deploy/restore.sh"
rollback-sqlite = "bash deploy/rollback-to-sqlite.sh"

[dependencies]
python = ">=3.14.5,<3.15"
nodejs = ">=26.3.0,<26.4"

[pypi-dependencies]
pytest = "*"
requests = "*"
sqlalchemy = "*"
pyseekdb = ">=1.1.0.post2, <2"
duckdb = ">=1.5.5, <2"
duckdb-engine = ">=0.17.0, <0.18"
